_schema-version: 3.3.0
ID: incident-management
description: A simple CAP project.
version: 1.0.0
modules:
- name: incident-management-srv
  type: javascript.nodejs
  path: incident-management-srv
  requires:
  - name: incident-management-db
  - name: incident-management-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
    memory: 256M
- name: incident-management-db-deployer
  type: com.sap.xs.hdi
  path: incident-management-db-deployer
  requires:
  - name: incident-management-db
  parameters:
    buildpack: nodejs_buildpack
    memory: 256M
- name: incident-management-ui-deployer
  type: com.sap.application.content
  path: incident-management-ui-deployer
  requires:
  - name: incident-management-html5-app-host-service
    parameters:
      content-target: true
resources:
- name: incident-management-db
  type: com.sap.xs.hdi-container
  parameters:
    service-plan: hdi-shared
- name: incident-management-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            ForwardAuthToken: true
            HTML5.DynamicDestination: true
            Name: incident-management-html5
            ProxyType: Internet
            ServiceInstanceName: incident-management-repo-runtime
            Type: HTTP
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: incident-management-html5-app-host-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: incident-management-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
