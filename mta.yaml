_schema-version: "3.3"
ID: incident-management
version: 1.0.0
description: "CAP Incident Management Application"

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # CAP Service
  - name: incident-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    requires:
      - name: incident-management-db
      - name: incident-management-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # HANA HDI Deployer
  - name: incident-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    requires:
      - name: incident-management-db

  # HTML5 App
  - name: incidents-ui
    type: html5
    path: app/incidents
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  # UI Deployer
  - name: incident-management-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: incident-management-html5-app-host-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: incidents-ui
          artifacts:
            - incidents.zip
          target-path: resources/

  # Destination Content
  - name: incident-management-destination-content
    type: com.sap.application.content
    requires:
      - name: incident-management-destination-service
        parameters:
          content-target: true
      - name: incident-management-auth
        parameters:
          service-key:
            name: incident-management-auth-key
      - name: incident-management-html5-app-host-service
        parameters:
          service-key:
            name: incident-management-html5-app-host-service-key
      - name: srv-api
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: incident-management-app-srv
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: incident-management-auth
              TokenServiceKeyName: incident-management-auth-key
              HTML5.DynamicDestination: true
              sap.cloud.service: incident-management 
            - Name: incident-management-html5-app-host-service
              ServiceInstanceName: incident-management-html5-app-host-service
              ServiceKeyName: incident-management-html5-app-host-service-key
              sap.cloud.service: incident-management
            - Name: incident-management-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: incident-management-auth
              ServiceKeyName: incident-management-auth-key
              sap.cloud.service: incident-management
    build-parameters:
      no-source: true


resources:

  # HANA HDI Container
  - name: incident-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service-plan: hdi-shared

  # XSUAA
  - name: incident-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: incident-management-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.cfapps.us10.hana.ondemand.com/**
            - https://*.cfapps.us10-001.hana.ondemand.com/**

  # Destination Service
  - name: incident-management-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com

  # HTML5 App Host
  - name: incident-management-html5-app-host-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # HTML5 App Runtime
  - name: incident-management-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # SAP Build Work Zone Standard
  - name: incident-management-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: build-workzone-standard
      service-plan: standard
